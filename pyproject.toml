[project]
name = "omagram"
version = "0.1.0"
description = "A small keyboard-first Telegram TUI for Omarchy"
requires-python = ">=3.12"
dependencies = [
  "textual>=0.70",
  "telethon>=1.36",
  "python-dotenv>=1.0",
  "qrcode>=7.4",
  "textual-image[textual]>=0.13.2",
]

[project.scripts]
omagram = "telegram_tui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_tui"]
